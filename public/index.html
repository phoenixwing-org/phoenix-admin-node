<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Phoenix Admin Node</title>
	<meta name="keywords" content="Phoenix Admin，后台管理系统，Vue，Element Plus，Midway，PostgreSQL" />
	<meta name="description" content="Phoenix Admin Host 后端服务，提供用户、组织、权限、菜单与审计基础能力。" />
	<link rel="stylesheet" href="css/welcome.css" />
	<link rel="icon" href="pah-phoenixwing-mark.svg" type="image/svg+xml" />
</head>
<body>
	<main class="pah-welcome">
		<header class="pah-brand">
			<img src="pah-phoenixwing-mark.svg" alt="" />
			<div>
				<strong>Phoenix Admin</strong>
				<span>HOST SERVICE</span>
			</div>
		</header>

		<section class="pah-service-card" aria-labelledby="service-title">
			<p class="pah-status"><span aria-hidden="true"></span> SERVICE ONLINE</p>
			<h1 id="service-title">Phoenix Admin Node</h1>
			<p class="pah-intro">
				用户、组织、权限、菜单与审计服务已经启动，可以进入 Phoenix Admin Host 工作台。
			</p>

			<a class="pah-primary-action" href="http://localhost:9000/">
				<span>打开 Phoenix Admin Vue</span>
				<strong aria-hidden="true">→</strong>
			</a>

			<dl class="pah-runtime">
				<div><dt>API PORT</dt><dd>8101</dd></div>
				<div><dt>DATABASE</dt><dd>PostgreSQL</dd></div>
				<div><dt>VERSION</dt><dd>0.2.2</dd></div>
				<div>
					<dt>FRAMEWORK</dt>
					<dd><a href="https://midwayjs.org/">Midway 4.2.1</a></dd>
				</div>
			</dl>

			<p class="pah-framework-source">
				<a href="https://github.com/midwayjs/midway">Midway 官方源码</a>
			</p>
		</section>

		<footer>
			<span>PHOENIXWING MAINTAINED FORK</span>
			<span class="pah-footer-line"></span>
			<span>BASED ON COOL ADMIN 8.x · MIT</span>
		</footer>
	</main>
</body>
</html>
